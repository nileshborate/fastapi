# Video 61 - Nginx in front of the api: HTTPS, HTTP -> HTTPS, gzip, security headers, limits
# mounted as /etc/nginx/conf.d/default.conf - nginx.conf includes it inside its http { } block
# + homework 61: a limit for writes, a JSON access log with a request id, static files

upstream api {
    zone api 64k;
    server api:8000 resolve;               # looks the name up again when the container changes
    keepalive 16;                          # reuse connections to uvicorn
}
resolver 127.0.0.11 valid=10s ipv6=off;    # Docker's DNS, inside every container

limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;    # 10 requests a second per IP

# homework 61.1: only POST gets a key - an EMPTY key is never counted, so GET stays at 10/s
map $request_method $write_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $write_key zone=writes:10m rate=2r/s;             # 2 writes a second per IP

# homework 61.2: one JSON object per request - $request_id is nginx's own 32 hex characters
log_format json_access escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","request":"$request","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;  # port 80 only sends you to HTTPS
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log json_access;    # stdout in the image

    server_tokens off;                     # "nginx" - not "nginx/1.28.0"
    client_max_body_size 1m;               # bigger bodies: 413, the api never sees them
    limit_req zone=perip burst=20 nodelay;
    limit_req_status 429;

    # security headers - "always": on errors too. Only HERE: an add_header in a location
    # would replace ALL of these for that location
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Request-ID $request_id always;           # the client can quote it

    gzip on;
    gzip_types application/json text/css application/javascript;  # text/html: always
    gzip_min_length 1000;                  # small answers: not worth it

    # proxy settings on the SERVER level: every location with a proxy_pass inherits them
    proxy_http_version 1.1;                # needed for keepalive to the upstream
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;            # the SAME id in the api's log
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://api;
    }

    # homework 61.1: a limit_req HERE replaces the server's one - so both are listed again
    location = /courses {
        limit_req zone=perip burst=20 nodelay;
        limit_req zone=writes burst=4 nodelay;
        proxy_pass http://api;
    }

    # homework 61.3: static files from nginx itself - the api never sees these requests
    location /docs-site/ {
        root /srv;                         # /docs-site/x.css -> /srv/docs-site/x.css
        expires 1h;                        # Cache-Control: max-age=3600 - NOT add_header
    }
}
