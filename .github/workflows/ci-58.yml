# Video 58 - CI/CD for the folder 58-ci-cd: lint -> test (2 Pythons) -> build + publish
name: ci-58

on:
  push:
    branches: [main]
    paths: ["58-ci-cd/**", ".github/workflows/ci-58.yml"]
  pull_request:
    paths: ["58-ci-cd/**", ".github/workflows/ci-58.yml"]
  workflow_dispatch:                      # a "Run workflow" button in the Actions tab

permissions:
  contents: read                          # least privilege: read the code, nothing more

concurrency:                              # a new push cancels the old run of the same branch
  group: ci-58-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 58-ci-cd           # this repo has one folder per video

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.5
      - run: ruff check --output-format=github .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 58-ci-cd/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                     # only this job may push to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/coursehub
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t coursehub:ci .
      - name: Smoke test - the container must become healthy
        run: |
          docker run -d --name api -p 8000:8000 coursehub:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api)
            echo "$i s: $status"
            [ "$status" = healthy ] && break
            sleep 1
          done
          docker logs api
          [ "$status" = healthy ]
          curl -fsS localhost:8000/health/ready
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag coursehub:ci "$IMAGE:${{ github.sha }}"
          docker tag coursehub:ci "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
