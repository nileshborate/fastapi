# Video 59 homework - pytest against a REAL PostgreSQL: a service container next to the job
name: ci-59

on:
  push:
    branches: [main]
    paths: ["59-postgres/**", ".github/workflows/ci-59.yml"]
  pull_request:
    paths: ["59-postgres/**", ".github/workflows/ci-59.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-59-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 59-postgres

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.5
      - run: ruff check --output-format=github .

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:                             # GitHub starts it BEFORE the first step ...
        image: postgres:16
        env:
          POSTGRES_USER: coursehub
          POSTGRES_PASSWORD: coursehub-dev  # a throwaway CI database - not a real secret
          POSTGRES_DB: coursehub_test       # the tests' database: no init script needed
        ports:
          - 5432:5432                       # the job runs on the runner -> localhost:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U coursehub -d coursehub_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
        # ... and waits until it is (healthy)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 59-postgres/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov
        env:
          TEST_DATABASE_URL: postgresql://coursehub:coursehub-dev@localhost:5432/coursehub_test
