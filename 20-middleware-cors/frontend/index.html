<!doctype html>
<!-- A tiny "frontend" on a DIFFERENT origin.  Run:  python -m http.server 3000 --directory frontend
     then open http://localhost:3000 while the API runs on http://127.0.0.1:8000 -->
<html>
<head><meta charset="utf-8"><title>Course Hub Frontend</title></head>
<body style="font-family: sans-serif; padding: 2rem">
  <h1>Course Hub</h1>
  <button onclick="loadCourses()">Load courses</button>
  <pre id="out"></pre>
  <script>
    async function loadCourses() {
      const out = document.getElementById("out");
      try {
        const response = await fetch("http://127.0.0.1:8000/courses");
        const data = await response.json();
        out.textContent = "Request ID: " + response.headers.get("X-Request-ID") + "\n" + JSON.stringify(data, null, 2);
      } catch (error) {
        out.textContent = "Blocked! Open the browser console (F12) to see the CORS error.";
      }
    }
  </script>
</body>
</html>
