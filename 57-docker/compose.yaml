# docker compose up -d --build   ·   docker compose ps   ·   docker compose down
name: coursehub

services:
  api:
    build: .
    image: coursehub:1.5.1-small
    ports:
      - "8000:8000"
    env_file: .env                    # homework 57: config without a rebuild
    volumes:
      - coursehub-data:/data          # the database survives a new container
    restart: unless-stopped

volumes:
  coursehub-data:
