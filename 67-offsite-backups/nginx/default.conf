# Video 62/63 - the Video 61 config on a real server: a real certificate from Let's Encrypt
# mounted as /etc/nginx/conf.d/default.conf - nginx.conf includes it inside its http { } block
# No domain name in here: "server_name _" + the certificate is always called "coursehub"

upstream api {
    zone api 64k;
    server api:8000 resolve;               # looks the name up again when the container changes
    keepalive 16;                          # reuse connections to uvicorn
}
resolver 127.0.0.11 valid=10s ipv6=off;    # Docker's DNS, inside every container

# Video 66: the load-test machine - NO rate limit for this one IP, only while we test.
# An empty key is never counted. Remove the IP when the test is done!
geo $loadtest {
    default        0;
    10.62.0.1      1;                      # my load generator (yours: its public IP)
}
map $loadtest $perip_key {
    0 $binary_remote_addr;
    1 "";
}
# a NEW zone name: an existing zone can't change its key on a reload (Video 66, finding 2)
limit_req_zone $perip_key zone=visitors:10m rate=10r/s;          # 10 requests a second per IP

# homework 61.1: only POST gets a key - an EMPTY key is never counted, so GET stays at 10/s
map $request_method $write_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $write_key zone=writes:10m rate=2r/s;             # 2 writes a second per IP

# homework 66: a MICRO-cache for GET /courses - the same answer for 5 s, the api sees ONE
proxy_cache_path /var/cache/nginx/courses levels=1:2 keys_zone=courses:10m max_size=50m
                 inactive=1m;

# homework 61.2: one JSON object per request - $request_id is nginx's own 32 hex characters
log_format json_access escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","request":"$request","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;

    # Let's Encrypt checks the domain HERE (HTTP-01): certbot puts a file in /var/www/certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;  # everything else: to HTTPS
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # certbot --cert-name coursehub: live/ holds SYMLINKS into archive/ - so compose mounts
    # all of /etc/letsencrypt, never just live/coursehub
    ssl_certificate     /etc/letsencrypt/live/coursehub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coursehub/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;     # a returning browser skips the full handshake

    access_log /var/log/nginx/access.log json_access;    # stdout in the image

    server_tokens off;                     # "nginx" - not "nginx/1.28.0"
    client_max_body_size 1m;               # bigger bodies: 413, the api never sees them
    limit_req zone=visitors burst=20 nodelay;
    limit_req_status 429;

    # security headers - "always": on errors too. Only HERE: an add_header in a location
    # would replace ALL of these for that location
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Request-ID $request_id always;           # the client can quote it
    add_header X-Cache $upstream_cache_status always;     # homework 66: HIT / MISS (or none)

    gzip on;
    gzip_types application/json text/css application/javascript;  # text/html: always
    gzip_min_length 1000;                  # small answers: not worth it

    # proxy settings on the SERVER level: every location with a proxy_pass inherits them
    proxy_http_version 1.1;                # needed for keepalive to the upstream
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;            # the SAME id in the api's log
    proxy_connect_timeout 1s;              # homework 62: a stopped api fails FAST
    proxy_read_timeout 30s;
    # homework 62: during a rollout one api is going away - try the other one
    # (a request that already reached an api is NOT sent twice: POST is not idempotent)
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    location / {
        proxy_pass http://api;
    }

    # homework 61.1: a limit_req HERE replaces the server's one - so both are listed again
    location = /courses {
        limit_req zone=visitors burst=20 nodelay;
        limit_req zone=writes burst=4 nodelay;
        proxy_pass http://api;
        proxy_cache courses;               # homework 66: GET + HEAD only - POST: never cached
        proxy_cache_valid 200 5s;          # a new course shows up after at most 5 s
        proxy_cache_lock on;               # 100 misses at once: ONE request goes to the api
        proxy_cache_use_stale updating;    # while it refreshes: the others get the old copy
    }

    # Video 65: /metrics is for Prometheus ONLY - it reads api:8000 inside the network.
    # Through nginx it would show the whole world your routes, traffic and errors
    location = /metrics {
        return 404;
    }

    # homework 61.3: static files from nginx itself - the api never sees these requests
    location /docs-site/ {
        root /srv;                         # /docs-site/x.css -> /srv/docs-site/x.css
        expires 1h;                        # Cache-Control: max-age=3600 - NOT add_header
    }
}
