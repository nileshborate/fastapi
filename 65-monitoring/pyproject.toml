# One place for the tool settings - the same rules on your laptop and in CI
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]          # a warning today is an error tomorrow

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 90
